<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASMI PHISING — Report Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #d0e0ff;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.05);
            margin-bottom: 15px;
        }
        .nav a {
            color: #6688aa;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 6px 16px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .nav a:hover,
        .nav a.active {
            color: #00ffff;
            background: rgba(0, 255, 255, 0.06);
        }
        .header {
            text-align: center;
            padding: 10px 0;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            background: linear-gradient(90deg, #00ffff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            font-size: 0.7rem;
            color: #6688aa;
            letter-spacing: 2px;
        }
        .header .status {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            background: rgba(0, 255, 255, 0.06);
            border: 1px solid rgba(0, 255, 255, 0.08);
            font-size: 0.65rem;
            color: #00ffff;
            margin: 6px 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
        }
        .card-title {
            color: #00ffff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.05);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            margin: 10px 0;
        }
        .stats .item {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .stats .item .num {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00ffff;
            display: block;
        }
        .stats .item .label {
            font-size: 0.5rem;
            color: #6688aa;
            text-transform: uppercase;
        }
        .stats .item .num.valid {
            color: #00ff88;
        }
        .stats .item .num.invalid {
            color: #ff4444;
        }
        .stats .item .num.opened {
            color: #ffaa00;
        }
        .url-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .url-list .row {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            font-size: 0.7rem;
            color: #88ccdd;
            display: flex;
            justify-content: space-between;
        }
        .url-list .row .badge {
            font-size: 0.5rem;
            padding: 0 8px;
            border-radius: 10px;
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
        }
        .detail-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-left: 3px solid #00ffff;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #88ccdd;
            margin: 10px 0;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin: 10px 0;
        }
        .tabs button {
            padding: 6px 16px;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            color: #8899bb;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .tabs button.active {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
        }
        .tabs button:hover {
            background: rgba(0, 255, 255, 0.06);
        }
        .panel {
            display: none;
            margin-top: 6px;
        }
        .panel.active {
            display: block;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.06);
            border-radius: 8px;
            color: #d0e0ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            resize: vertical;
        }
        .list-urls {
            min-height: 50px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.06);
            border-radius: 8px;
            font-size: 0.65rem;
            max-height: 120px;
            overflow-y: auto;
        }
        .list-urls .item {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .list-urls .item:last-child {
            border-bottom: none;
        }
        .notice {
            padding: 8px 12px;
            background: rgba(255, 170, 0, 0.04);
            border: 1px solid rgba(255, 170, 0, 0.08);
            border-radius: 8px;
            font-size: 0.6rem;
            color: #8899bb;
            margin-top: 8px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
        }
        .btn-copy {
            background: linear-gradient(135deg, #00ff88, #00cc77);
        }
        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #0088ff);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #ff4500, #ff8c00);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.2);
        }
        .btn-danger {
            background: rgba(255, 68, 68, 0.12);
            border: 1px solid rgba(255, 68, 68, 0.15);
            color: #ff4444;
        }
        .btn-danger:hover {
            background: rgba(255, 68, 68, 0.2);
        }
        .empty {
            text-align: center;
            padding: 30px 20px;
            color: #445566;
        }
        .empty .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .empty a {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 20px;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.12);
            border-radius: 8px;
            color: #00ffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.7rem;
        }
        .empty a:hover {
            background: rgba(0, 255, 255, 0.15);
        }
        .live-feed {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.04);
            max-height: 55px;
            overflow-y: auto;
            font-size: 0.6rem;
            color: #88ccdd;
        }
        .live-feed .entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
        }
        .live-feed .entry .time {
            color: #00ffff;
            margin-right: 8px;
        }
        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #445566;
            padding: 15px 0 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: 10px;
        }
        #toast {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid #00ffff;
            color: #d0e0ff;
            padding: 10px 20px;
            border-radius: 12px;
            z-index: 9999;
            display: none;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #a855f7);
            border-radius: 10px;
            transition: width 0.5s;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- NAV -->
        <nav class="nav">
            <a href="index.html">DASHBOARD</a>
            <a href="laporan.html" class="active">LAPORAN</a>
        </nav>

        <!-- HEADER -->
        <header class="header">
            <h1>BASMI PHISING</h1>
            <div class="sub">REPORT CENTER</div>
            <div class="status" id="statusLabel">BELUM ADA DATA</div>
        </header>

        <!-- PROGRESS -->
        <div class="card">
            <div class="card-title">📊 PROGRES PELAPORAN</div>
            <div style="display:flex;justify-content:space-between;font-size:0.65rem;color:#8899bb;">
                <span>Progres</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar">
                <div class="fill" id="progressFill"></div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,255,255,0.05);padding-bottom:8px;margin-bottom:10px;">
                <span style="color:#00ffff;font-size:0.7rem;font-weight:700;">📋 REPORT DESTINATION</span>
                <span id="reportCount" style="color:#00ff88;font-weight:700;font-size:0.75rem;">0 URL</span>
            </div>

            <!-- KONTEN DINAMIS -->
            <div id="content"></div>

            <!-- TABS -->
            <div class="tabs" id="tabContainer" style="display:none;">
                <button class="active" data-tab="email">📧 EMAIL</button>
                <button data-tab="netcraft">🌐 NETCRAFT</button>
            </div>

            <!-- EMAIL PANEL -->
            <div id="emailPanel" class="panel active">
                <div style="display:flex;justify-content:space-between;margin:6px 0 4px;">
                    <label style="color:#00ffff;font-size:0.7rem;font-weight:700;">TEMPLATE LAPORAN</label>
                    <span style="font-size:0.55rem;color:#6688aa;">Otomatis dari Dashboard</span>
                </div>
                <textarea id="emailPreview" placeholder="Belum ada data laporan."></textarea>
                <div class="btn-group">
                    <button id="copyEmailBtn" class="btn btn-copy">📋 SALIN LAPORAN</button>
                    <button id="refreshBtn" class="btn btn-primary">↻ PERBARUI</button>
                </div>
            </div>

            <!-- NETCRAFT PANEL -->
            <div id="netcraftPanel" class="panel">
                <div style="display:flex;justify-content:space-between;margin:6px 0 4px;">
                    <label style="color:#00ffff;font-size:0.7rem;font-weight:700;">URL UNTUK NETCRAFT</label>
                    <span style="font-size:0.55rem;color:#6688aa;">Bulk report</span>
                </div>
                <div id="netcraftList" class="list-urls">
                    <div style="opacity:0.5;">Belum ada URL.</div>
                </div>
                <div class="btn-group">
                    <button id="copyUrlsBtn" class="btn btn-copy">📋 SALIN URL</button>
                    <button id="openNetcraftBtn" class="btn btn-secondary">↗ BUKA NETCRAFT</button>
                </div>
                <div class="notice">⚡ Saat BUKA NETCRAFT ditekan, URL akan disalin ke clipboard.</div>
            </div>
        </div>

        <!-- LIVE FEED -->
        <div class="live-feed" id="liveFeed">
            <div class="entry"><span class="time">[SISTEM]</span> Report Center siap</div>
        </div>

        <footer>© BASMI PHISING · REPORT CENTER</footer>
    </div>

    <div id="toast"></div>

    <script>
        // ============================================================
        // TOAST
        // ============================================================
        function toast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.borderColor = type === 'success' ? '#00ff88' : type === 'error' ? '#ff4444' : '#00ffff';
            el.style.color = type === 'success' ? '#00ff88' : type === 'error' ? '#ff4444' : '#d0e0ff';
            el.style.display = 'block';
            clearTimeout(el._hide);
            el._hide = setTimeout(() => el.style.display = 'none', 3000);
        }

        // ============================================================
        // LIVE FEED
        // ============================================================
        function feed(msg) {
            const el = document.getElementById('liveFeed');
            const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `<span class="time">[${t}]</span> ${msg}`;
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
            if (el.children.length > 20) el.removeChild(el.firstChild);
        }

        // ============================================================
        // LOAD DATA — NARIK DARI localStorage
        // ============================================================
        const STORAGE_KEY = "basmi_phising_reports";

        function loadData() {
            // Ambil data dari localStorage
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const reports = Array.isArray(saved) ? saved : [];

            const total = reports.length;
            const valid = reports.filter(r => r.valid).length;
            const invalid = reports.filter(r => !r.valid).length;
            const opened = reports.filter(r => r.opened).length;
            const detail = localStorage.getItem('basmi_phising_detail') || '';

            const statusLabel = document.getElementById('statusLabel');
            const content = document.getElementById('content');
            const reportCount = document.getElementById('reportCount');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const tabContainer = document.getElementById('tabContainer');
            const emailPreview = document.getElementById('emailPreview');
            const netcraftList = document.getElementById('netcraftList');

            // Update report count & progress
            reportCount.textContent = total + ' URL';
            const pct = total === 0 ? 0 : Math.min(100, Math.round(((valid + invalid) / total) * 100));
            progressFill.style.width = pct + '%';
            progressText.textContent = pct + '%';

            // Cek ada data atau tidak
            if (total === 0) {
                statusLabel.textContent = 'BELUM ADA DATA';
                content.innerHTML = `
                    <div class="empty">
                        <span class="icon">📭</span>
                        <p>Belum ada data laporan</p>
                        <p style="font-size:0.65rem;color:#6688aa;margin:4px 0;">Masukkan URL di Dashboard lalu tekan PROSES URL</p>
                        <a href="index.html">⬅ KE DASHBOARD</a>
                    </div>
                `;
                tabContainer.style.display = 'none';
                emailPreview.value = 'Belum ada data laporan. Masukkan URL di Dashboard.';
                netcraftList.innerHTML = '<div style="opacity:0.5;">Belum ada URL.</div>';
                return;
            }

            statusLabel.textContent = 'DATA TERSEDIA';
            tabContainer.style.display = 'flex';

            // STATS
            let html = `
                <div class="stats">
                    <div class="item"><span class="num">${total}</span><span class="label">Total URL</span></div>
                    <div class="item"><span class="num valid">${valid}</span><span class="label">Valid</span></div>
                    <div class="item"><span class="num invalid">${invalid}</span><span class="label">Invalid</span></div>
                    <div class="item"><span class="num opened">${opened}</span><span class="label">Dibuka</span></div>
                </div>
            `;

            // DETAIL
            if (detail) {
                html += `<div class="detail-box">📝 <strong style="color:#00ffff;">Detail Laporan:</strong><br>${detail}</div>`;
            }

            // URL LIST
            if (total > 0) {
                html += `<div style="color:#6688aa;font-size:0.6rem;margin:6px 0 4px;">🔗 Daftar URL (${total})</div>
                         <div class="url-list">
                            ${reports.map((r, i) => `<div class="row"><span>${i+1}. ${r.url}</span><span class="badge">${r.opened ? '✅ Dibuka' : '⏳ Pending'}</span></div>`).join('')}
                         </div>`;
            }

            content.innerHTML = html;

            // UPDATE EMAIL PREVIEW
            if (total > 0) {
                const detailText = localStorage.getItem('basmi_phising_detail') || 'URL ini diduga terkait aktivitas phishing.';
                emailPreview.value =
                    '📢 LAPORAN PHISHING\n\n' +
                    'Detail Laporan:\n' + detailText + '\n\n' +
                    'Daftar URL:\n' + reports.map((r, i) => (i + 1) + '. ' + r.url).join('\n') + '\n\n' +
                    'Total URL: ' + total + '\n' +
                    'Valid: ' + valid + '\n' +
                    'Invalid: ' + invalid + '\n\n' +
                    '— BASMI PHISING · Security Console';
            }

            // UPDATE NETCRAFT LIST
            if (total > 0) {
                netcraftList.innerHTML = reports.map(r => `<div class="item">• ${r.url}</div>`).join('');
            } else {
                netcraftList.innerHTML = '<div style="opacity:0.5;">Belum ada URL.</div>';
            }
        }

        // ============================================================
        // BUTTONS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {

            // LOAD DATA
            loadData();
            feed('🟢 Report Center siap digunakan');

            // AUTO REFRESH tiap 10 detik
            setInterval(loadData, 10000);

            // TAB SWITCH
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                    document.getElementById(tab + 'Panel').classList.add('active');
                });
            });

            // COPY EMAIL
            document.getElementById('copyEmailBtn').addEventListener('click', function() {
                const text = document.getElementById('emailPreview').value;
                if (!text || text.trim() === '' || text.includes('Belum ada data')) {
                    toast('⚠️ Belum ada data laporan', 'warning');
                    return;
                }
                navigator.clipboard.writeText(text).then(() => {
                    toast('✅ Laporan disalin!', 'success');
                    feed('📋 Laporan disalin ke clipboard');
                }).catch(() => toast('❌ Gagal menyalin', 'error'));
            });

            // COPY URLS
            document.getElementById('copyUrlsBtn').addEventListener('click', function() {
                const items = document.querySelectorAll('#netcraftList .item');
                if (items.length === 0) {
                    toast('⚠️ Belum ada URL', 'warning');
                    return;
                }
                const text = Array.from(items).map(el => el.textContent.replace('• ', '')).join('\n');
                navigator.clipboard.writeText(text).then(() => {
                    toast('✅ ' + items.length + ' URL disalin!', 'success');
                    feed('📋 ' + items.length + ' URL disalin');
                }).catch(() => toast('❌ Gagal menyalin', 'error'));
            });

            // OPEN NETCRAFT
            document.getElementById('openNetcraftBtn').addEventListener('click', function() {
                const items = document.querySelectorAll('#netcraftList .item');
                if (items.length === 0) {
                    toast('⚠️ Belum ada URL', 'warning');
                    return;
                }
                const text = Array.from(items).map(el => el.textContent.replace('• ', '')).join('\n');
                navigator.clipboard.writeText(text).then(() => {
                    toast('✅ URL disalin! Membuka Netcraft...', 'success');
                    feed('📤 Membuka Netcraft dengan ' + items.length + ' URL');
                    window.open('https://safebrowsing.google.com/', '_blank');
                }).catch(() => toast('❌ Gagal menyalin', 'error'));
            });

            // REFRESH
            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadData();
                toast('✅ Data diperbarui!', 'success');
                feed('🔄 Data diperbarui');
            });

            console.log('🔥 BASMI PHISING — Report Center jalan!');
            console.log('📊 Data dari localStorage:', localStorage.getItem(STORAGE_KEY));
        });
    </script>

</body>
</html>
