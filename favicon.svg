<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bpGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19e6c1"></stop>
      <stop offset="50%" stop-color="#168cff"></stop>
      <stop offset="100%" stop-color="#e66cff"></stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#06121f"></rect>

  <!-- Neon border -->
  <rect x="7" y="7" width="50" height="50" rx="13" fill="none" stroke="url(#bpGradient)" stroke-width="2.5" filter="url(#glow)"></rect>

  <!-- BP -->
  <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" letter-spacing="-2" fill="url(#bpGradient)" stroke="#bfffff" stroke-width=".35" paint-order="stroke" filter="url(#glow)">BP</text>

  <!-- Security diamond -->
  <path d="M32 12 L38 18 L32 24 L26 18 Z" fill="none" stroke="#b9ffff" stroke-width="1.8" stroke-linejoin="round" opacity=".95" filter="url(#glow)"></path>

  <!-- Center point -->
  <circle cx="32" cy="18" r="1.5" fill="#ffffff"></circle>
</svg>
