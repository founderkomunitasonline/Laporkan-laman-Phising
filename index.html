<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASMI PHISING - Security Console</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- ===== STYLE UTAMA ===== -->
    <link rel="stylesheet" href="styles.css">

    <!-- ===== ANIMASI TAMBAHAN ===== -->
    <style>
        /* Fade-in untuk seluruh shell */
        .app-shell {
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.96) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Glow berdenyut untuk ikon perisai */
        .brand-shield {
            animation: pulseGlow 2.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 5px #00ffff); }
            100% { filter: drop-shadow(0 0 25px #00ffff); }
        }

        /* Shimmer teks untuk judul */
        .brand-title {
            background: linear-gradient(90deg, #00ffff, #a855f7, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textShimmer 4s linear infinite;
        }
        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Subtitle slide-in */
        .brand-subtitle {
            animation: slideIn 0.8s ease-out 0.3s both;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* Badge statistik animasi */
        .stats {
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        /* Efek hover halus untuk navigasi */
        .page-nav a {
            transition: all 0.3s ease;
        }
        .page-nav a:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <!-- ===== MAIN APP ===== -->
    <main class="app-shell">
        <!-- Navigasi -->
        <nav class="page-nav">
            <a href="index.html" class="active">Dashboard</a>
            <a href="laporan.html">Laporan</a>
        </nav>

        <!-- Hero / Branding -->
        <header class="hero">
            <div class="brand">
                <div class="brand-shield">🛡️</div>
                <div class="brand-title">BASMI PHISING</div>
                <div class="brand-subtitle">Security Console · Report & Monitor</div>
            </div>
            <section class="stats">
                <!-- Konten statistik dari JS nanti diisi -->
            </section>
        </header>

        <!-- ===== KONTEN UTAMA LAINNYA ===== -->
        <!-- (Sesuai dengan yang ada di file asli kamu) -->

    </main>

    <!-- ===== SCRIPTS ===== -->
    <script src="app.js"></script>
    <script src="app-detail.js"></script>
    <script src="binary-rain.js"></script>

    <!-- ===== TRIGGER ANIMASI ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Animasi BASMI PHISING aktif!');
            // Trigger fade-in ulang kalau perlu
            const shell = document.querySelector('.app-shell');
            if (shell) {
                shell.style.animation = 'fadeIn 0.8s ease-out';
            }
        });
    </script>

</body>
</html>
