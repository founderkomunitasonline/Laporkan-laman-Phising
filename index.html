<!-- ===== ANIMASI TAMBAHAN (TANPA MERUBAH FUNGSI) ===== -->
<style>
    /* Animasi fade-in untuk seluruh halaman */
    .app-shell {
        animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn {
        0% { opacity: 0; transform: scale(0.96) translateY(20px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Glow berdenyut untuk ikon perisai */
    .brand-shield {
        animation: pulseGlow 2.5s infinite alternate;
    }
    @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 5px #00ffff); }
        100% { filter: drop-shadow(0 0 25px #00ffff); }
    }

    /* Efek shimmer pada judul */
    .brand-title {
        background: linear-gradient(90deg, #00ffff, #a855f7, #00ffff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: textShimmer 4s linear infinite;
    }
    @keyframes textShimmer {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    /* Slide-in subtitle */
    .brand-subtitle {
        animation: slideIn 0.8s ease-out 0.3s both;
    }
    @keyframes slideIn {
        0% { opacity: 0; transform: translateX(-20px); }
        100% { opacity: 1; transform: translateX(0); }
    }

    /* Efek hover halus untuk navigasi */
    .page-nav a {
        transition: all 0.3s ease;
    }
    .page-nav a:hover {
        transform: translateY(-2px);
        text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
    }
</style>

<script>
    // Trigger animasi saat halaman dimuat
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Animasi tambahan aktif!');
    });
</script>
